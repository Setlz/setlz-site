<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setlz — three widths after Phase 2.3</title>
<style>
  :root{--paper:#FBFAF7;--ink:#15171A;--soft:#4A4E54;--line:#DAD7CE}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fff;font:13px/1.4 system-ui,sans-serif;color:var(--ink);padding:14px}
  h1{font-size:15px;margin-bottom:2px}
  .sub{color:var(--soft);font-size:11.5px;margin-bottom:12px}
  .sheet{display:flex;gap:14px;align-items:flex-start}
  .col{flex:none}
  .cap{font-size:11px;font-weight:600;margin-bottom:5px}
  .cap span{font-weight:400;color:var(--soft)}
  .shot{border:1px solid var(--line);overflow:hidden;background:var(--paper)}
  iframe{border:0;display:block;transform-origin:0 0}
  /* one scale for all three so the comparison is honest */
  .s1440 .shot{width:432px;height:510px}
  .s1440 iframe{width:1440px;height:3000px;transform:scale(.3) translateY(-1150px)}
  .s768  .shot{width:230px;height:510px}
  .s768  iframe{width:768px;height:3400px;transform:scale(.3) translateY(-1500px)}
  .s390  .shot{width:117px;height:510px}
  .s390  iframe{width:390px;height:3600px;transform:scale(.3) translateY(-1750px)}
</style>
</head>
<body>
<h1>Three widths, after Phase 2.3</h1>
<p class="sub">Live iframes of the real page at 1440, 768 and 390, all at the same 0.30 scale. Scrolled to the ledger groups that replaced the stat cards and the step cards.</p>
<div class="sheet">
  <div class="col s1440"><p class="cap">1440 <span>desktop</span></p><div class="shot"><iframe src="/" data-y="1150"></iframe></div></div>
  <div class="col s768"><p class="cap">768 <span>tablet</span></p><div class="shot"><iframe src="/" data-y="1500"></iframe></div></div>
  <div class="col s390"><p class="cap">390 <span>mobile</span></p><div class="shot"><iframe src="/" data-y="1750"></iframe></div></div>
</div>
<script>
  // Same-origin, so each frame can be scrolled to the section we want to compare
  // and its reveal animations forced open.
  document.querySelectorAll('iframe').forEach(f=>{
    f.addEventListener('load',()=>{
      // Only force the reveal animations open. Vertical offset is done with a
      // transform in CSS, because scrolling is pinned in the preview pane.
      f.contentDocument.querySelectorAll('.reveal').forEach(e=>e.classList.add('is-visible'));
    });
  });
</script>
</body>
</html>
